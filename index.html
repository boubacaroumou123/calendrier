<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accueil</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071A38">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="menu.js" defer></script>
<style>
:root{--bg:#F5F8FC;--card:#fff;--tx:#0F172A;--mu:#5B6B85;--ac:#2563EB;--ac2:#E6EEFC;--bd:#E3E9F2;--gold:#FAB202;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1626;--card:#101E33;--tx:#EAF0FA;--mu:#9FB0C8;--ac:#3B82F6;--ac2:#16294A;--bd:#22314A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,var(--ac2),var(--bg) 55%);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto;min-height:100vh}
.hero{background:linear-gradient(135deg,#0A2A57,#071A38);color:#fff;border-radius:18px;padding:20px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1);margin-bottom:14px}
.hero .g{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:#FAB202}
.hero h1{margin:6px 0 2px;font-size:1.6rem}
#hm{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
#dt{color:#DCE6F5;text-transform:capitalize}
#hj{color:#FAB202;font-weight:600;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 12px;text-align:center;text-decoration:none;color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tile:active{background:var(--ac2)}
.tile .i{font-size:2.4rem}
.tile b{display:block;margin-top:6px;color:var(--ac)}
.tile span{display:block;margin-top:4px;color:var(--mu);font-size:.82rem}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac2);color:var(--ac);font-weight:600;cursor:pointer}
#inst{display:none;margin:14px auto 0}
</style>
</head>
<body>

<div class="hero">
  <div class="g">Bienvenue</div>
  <h1 id="gr">Bonjour</h1>
  <div id="hm">--:--</div>
  <div id="dt"></div>
  <div id="hj"></div>
</div>

<div class="grid">
  <a class="tile" href="calendriers.html"><div class="i">🕌</div><b>Calendriers et prières</b><span>Horloge, alarmes, heures de prière, météo, fêtes</span></a>
  <a class="tile" href="coran-audio.html"><div class="i">📖</div><b>Coran audio</b><span>Lecture, écoute et mémorisation</span></a>
  <a class="tile" href="adhkar.html"><div class="i">📿</div><b>Adhkar</b><span>Matin, soir et après la prière</span></a>
  <a class="tile" href="livre-comptes.html"><div class="i">💰</div><b>Livre de comptes</b><span>Recettes, dépenses et solde</span></a>
</div>

<div style="text-align:center"><button id="inst">📲 Installer l’appli</button></div>

<script>
const p2=n=>String(n).padStart(2,'0');
const $=id=>document.getElementById(id);
const HJF=new Intl.DateTimeFormat('fr-FR-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'});
function tick(){
  const n=new Date(),h=n.getHours();
  $('gr').textContent=h<5?'Bonsoir':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';
  $('hm').textContent=p2(h)+':'+p2(n.getMinutes());
  $('dt').textContent=n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  try{$('hj').textContent=HJF.format(n)+' H'}catch(e){}
}
tick();setInterval(tick,10000);

let dip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('inst').style.display='block'});
$('inst').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;$('inst').style.display='none'};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
