<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coran audio</title>
<link rel="manifest" href="manifest-coran.json">
<meta name="theme-color" content="#071A38">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F5F8FC;--card:#fff;--tx:#0F172A;--mu:#5B6B85;--ac:#2563EB;--ac2:#E6EEFC;--bd:#E3E9F2;--red:#D9060C;--gold:#FAB202;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1626;--card:#101E33;--tx:#EAF0FA;--mu:#9FB0C8;--ac:#3B82F6;--ac2:#16294A;--bd:#22314A;--red:#ff7b6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(90px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto}
h1{font-size:1.2rem;margin:0 0 12px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:9px 10px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}
.note{color:var(--mu);font-size:.8rem;margin-top:8px}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.vs{padding:10px 6px;border-top:1px solid var(--bd);border-radius:8px}
.vs.on{background:var(--ac2)}
.vs .ar{font-size:1.5rem;line-height:2;text-align:right}
.vs .fr{margin-top:4px}
.vs .bt{display:flex;gap:6px;margin-top:6px}
.vs .bt button{padding:6px 10px;font-size:.85rem}
.vs.m .bt .mm{background:var(--ac);color:#fff}
a.back{display:inline-block;margin-bottom:8px;color:var(--ac);text-decoration:none;font-size:.9rem}
#bar2{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:8px;justify-content:center;z-index:5}
#bar2.on{display:flex}
#bar2 span{align-self:center;font-size:.85rem;color:var(--mu)}
</style>
<script src="menu.js" defer></script>
</head>
<body>
<h1>📖 Coran : lecture, audio et mémorisation</h1>

<div class="card">
  <div class="row"><select id="qs" style="flex:1"></select><button class="g" id="qr">Reprendre</button></div>
  <div class="row" style="margin-top:8px"><button id="pa">▶ Écouter la sourate</button><button class="g" id="ps">⏹ Arrêter</button></div>
  <div class="note" id="qt">Choisis une sourate. Touche le texte arabe d’un verset pour le garder comme repère de lecture.</div>
  <div class="bar"><i id="pb"></i></div>
  <div class="note" id="pt"></div>
</div>

<div id="qa"></div>

<div id="bar2"><button class="g" id="pp">⏮</button><span id="cur"></span><button class="g" id="pn">⏭</button></div>

<div class="note" style="padding:0 6px">Texte arabe et traduction de Muhammad Hamidullah. Récitation : Mishary Alafasy (internet requis). Les sourates déjà ouvertes restent lisibles hors ligne.</div>

<script>
const $=id=>document.getElementById(id);
function sget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SN='Al-Fatiha|Al-Baqara|Al-Imran|An-Nissa|Al-Ma’ida|Al-An’am|Al-A’raf|Al-Anfal|At-Tawba|Younous|Houd|Youssouf|Ar-Ra’d|Ibrahim|Al-Hijr|An-Nahl|Al-Isra|Al-Kahf|Maryam|Ta-Ha|Al-Anbiya|Al-Hajj|Al-Mou’minoun|An-Nour|Al-Fourqan|Ach-Chou’ara|An-Naml|Al-Qasas|Al-Ankabout|Ar-Roum|Louqman|As-Sajda|Al-Ahzab|Saba|Fatir|Ya-Sin|As-Saffat|Sad|Az-Zoumar|Ghafir|Foussilat|Ach-Choura|Az-Zoukhrouf|Ad-Doukhan|Al-Jathiya|Al-Ahqaf|Mouhammad|Al-Fath|Al-Houjourat|Qaf|Adh-Dhariyat|At-Tour|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqi’a|Al-Hadid|Al-Moujadila|Al-Hachr|Al-Moumtahana|As-Saff|Al-Joumou’a|Al-Mounafiqoun|At-Taghabon|At-Talaq|At-Tahrim|Al-Moulk|Al-Qalam|Al-Haqqa|Al-Ma’arij|Nouh|Al-Jinn|Al-Mouzzammil|Al-Mouddaththir|Al-Qiyama|Al-Insan|Al-Moursalat|An-Naba|An-Nazi’at|Abasa|At-Takwir|Al-Infitar|Al-Moutaffifin|Al-Inshiqaq|Al-Bourouj|At-Tariq|Al-A’la|Al-Ghachiya|Al-Fajr|Al-Balad|Ach-Chams|Al-Layl|Ad-Dhouha|Ach-Charh|At-Tin|Al-Alaq|Al-Qadr|Al-Bayyina|Az-Zalzala|Al-Adiyat|Al-Qari’a|At-Takathour|Al-Asr|Al-Houmaza|Al-Fil|Qouraych|Al-Ma’oun|Al-Kawthar|Al-Kafiroun|An-Nasr|Al-Massad|Al-Ikhlas|Al-Falaq|An-Nas'.split('|');
const QB='https://api.alquran.cloud/v1/',QE='quran-uthmani,fr.hamidullah';
const AUDIO='https://cdn.islamic.network/quran/audio/128/ar.alafasy/';
let mem=sget('qmem',{}),qbm=sget('qbm2',null);
let cur={s:0,list:[]},idx=-1,playing=false,cont=false;
const au=new Audio();au.preload='auto';

function noBism(t,s,a){return (a===1&&s!==1&&s!==9&&t.startsWith('بِسْمِ'))?t.split(' ').slice(4).join(' '):t}
async function loadSurah(n){
  const k='qa_'+n,c=sget(k,null);if(c)return c;
  const r=await fetch(QB+'surah/'+n+'/editions/'+QE);
  if(!r.ok)throw 0;
  const j=await r.json(),ar=j.data[0].ayahs,fr=j.data[1].ayahs;
  const list=ar.map((x,i)=>[x.numberInSurah,noBism(x.text,n,x.numberInSurah),fr[i].text,x.number]);
  sset(k,list);return list;
}
const memCount=s=>(mem[s]||[]).length;
function totalMem(){return Object.values(mem).reduce((a,v)=>a+v.length,0)}
function progress(){
  const s=cur.s,n=cur.list.length,m=memCount(s);
  $('pb').style.width=(n?Math.round(m/n*100):0)+'%';
  $('pt').textContent=s?('Mémorisé dans '+SN[s-1]+' : '+m+' / '+n+' versets · Total : '+totalMem()+' / 6236'):('Total mémorisé : '+totalMem()+' / 6236 versets');
}
function paint(){
  const s=cur.s;
  $('qa').innerHTML=cur.list.map((x,i)=>{
    const m=(mem[s]||[]).includes(x[0]);
    return '<div class="card vs'+(m?' m':'')+'" data-i="'+i+'" style="margin-bottom:8px"><div class="ar" dir="rtl" lang="ar" data-b="'+x[0]+'">'+x[1]+' ﴿'+x[0]+'﴾</div><div class="fr">'+esc(x[2])+'</div><div class="bt"><button class="g" data-p="'+i+'">▶ Écouter</button><button class="g mm" data-m="'+x[0]+'">'+(m?'✅ Mémorisé':'Mémoriser')+'</button></div></div>';
  }).join('');
  mark();progress();
}
function mark(){
  document.querySelectorAll('#qa .vs').forEach(v=>v.classList.toggle('on',+v.dataset.i===idx&&playing));
  const b=qbm&&qbm.s===cur.s?document.querySelector('#qa [data-b="'+qbm.a+'"]'):null;
  document.querySelectorAll('#qa .ar').forEach(e=>e.style.textDecoration='');
  if(b)b.style.textDecoration='underline var(--gold) 3px';
}
async function showSurah(n,scrollTo){
  stop();cur={s:n,list:[]};
  if(!n){$('qa').innerHTML='';progress();return}
  $('qt').textContent='Chargement…';$('qa').innerHTML='';
  try{
    cur.list=await loadSurah(n);
    $('qt').textContent=SN[n-1]+' · '+cur.list.length+' versets. Touche le texte arabe d’un verset pour le garder comme repère.';
    paint();
    if(scrollTo){const el=document.querySelector('#qa [data-i="'+scrollTo+'"]');if(el)el.scrollIntoView({block:'center'})}
  }catch(e){$('qt').textContent='Connexion indisponible. Ouvre la page avec internet (https) : la sourate sera ensuite mémorisée pour le hors ligne.';progress()}
}
function playAt(i){
  if(i<0||i>=cur.list.length){stop();return}
  idx=i;playing=true;
  au.src=AUDIO+cur.list[i][3]+'.mp3';
  au.play().catch(()=>{$('qt').textContent='Audio indisponible : vérifie ta connexion.';stop()});
  $('bar2').classList.add('on');$('cur').textContent=SN[cur.s-1]+' · verset '+cur.list[i][0];
  mark();
  const el=document.querySelector('#qa [data-i="'+i+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
}
function stop(){playing=false;cont=false;try{au.pause()}catch(e){}idx=-1;$('bar2').classList.remove('on');mark()}
au.onended=()=>{if(cont&&idx<cur.list.length-1)playAt(idx+1);else stop()};
$('pa').onclick=()=>{if(!cur.list.length){$('qt').textContent='Choisis d’abord une sourate.';return}cont=true;playAt(idx>=0?idx:0)};
$('ps').onclick=stop;
$('pp').onclick=()=>{if(idx>0)playAt(idx-1)};
$('pn').onclick=()=>{if(idx<cur.list.length-1)playAt(idx+1);else stop()};
$('qa').onclick=e=>{
  const t=e.target;
  if(t.dataset.p!==undefined){cont=false;playAt(+t.dataset.p);return}
  if(t.dataset.m!==undefined){
    const a=+t.dataset.m,s=cur.s;mem[s]=mem[s]||[];
    const i=mem[s].indexOf(a);if(i>=0)mem[s].splice(i,1);else mem[s].push(a);
    if(!mem[s].length)delete mem[s];
    sset('qmem',mem);
    const v=t.closest('.vs'),on=i<0;
    v.classList.toggle('m',on);t.textContent=on?'✅ Mémorisé':'Mémoriser';progress();return;
  }
  const b=t.closest('[data-b]');
  if(b){qbm={s:cur.s,a:+b.dataset.b};sset('qbm2',qbm);mark();$('qt').textContent='Repère enregistré : '+SN[cur.s-1]+', verset '+qbm.a}
};
$('qr').onclick=async()=>{
  if(!qbm){$('qt').textContent='Aucun repère : ouvre une sourate et touche le texte arabe d’un verset.';return}
  $('qs').value=String(qbm.s);
  await showSurah(qbm.s,Math.max(0,qbm.a-1));
};
$('qs').innerHTML='<option value="0">Choisir une sourate…</option>'+SN.map((n,i)=>'<option value="'+(i+1)+'">'+(i+1)+'. '+n+'</option>').join('');
$('qs').onchange=()=>showSurah(+$('qs').value);
progress();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
